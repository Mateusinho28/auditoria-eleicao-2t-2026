<!doctype html>
<!-- Modelo da imagem de previa (site/og.png, 1200x630). Gerada com:
     msedge --headless=new --window-size=1200,630 --screenshot=site/og.png scripts/og_modelo.html -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f9f9f7; color: #0b0b0b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; padding: 64px 72px 56px; box-sizing: border-box;
  }
  .kicker { font-size: 26px; color: #52514e; }
  h1 { font-size: 64px; line-height: 1.05; margin: 14px 0 0; letter-spacing: -0.01em; }
  .meio { display: flex; align-items: flex-end; gap: 40px; }
  .num { font-size: 150px; font-weight: 600; line-height: 1; }
  .desc { font-size: 28px; color: #52514e; padding-bottom: 18px; max-width: 520px; line-height: 1.3; }
  .barras { display: grid; gap: 10px; margin-top: 4px; }
  .linha { display: flex; align-items: center; gap: 14px; font-size: 20px; color: #52514e; }
  .linha i { display: block; height: 18px; border-radius: 0 4px 4px 0; }
  .rodape { display: flex; justify-content: space-between; align-items: flex-end; font-size: 24px; color: #52514e; }
  .rodape b { color: #0b0b0b; }
</style>
</head>
<body>
  <div>
    <div class="kicker">Eleição presidencial 2026 · 2º turno · auditoria dos logs de todas as urnas</div>
    <h1>Quantos votos entraram depois das 17h?</h1>
  </div>
  <div class="meio">
    <div class="num">35.900</div>
    <div class="desc">votos depois das 17h, 0,81% da diferença de 4.430.191 entre os candidatos</div>
  </div>
  <div>
    <div class="barras">
      <div class="linha"><i style="width:760px;background:#2a78d6"></i>diferença</div>
      <div class="linha"><i style="width:7px;background:#eb6834"></i>votos depois das 17h</div>
    </div>
    <div class="rodape" style="margin-top:22px"><span>Por <b>Mateus Costa Cruz</b></span><span>499.177 urnas · dados do TSE</span></div>
  </div>
</body>
</html>
